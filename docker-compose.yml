services:
  recros:
    build: .
    ports:
      - "8000:8000"
    environment:
      RECROS_DB: /app/apps/api/data/recros.db
      RECROS_SEED_LIMIT: 800
    volumes:
      - recros_data:/app/apps/api/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  recros_data:

